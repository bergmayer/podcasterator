[package]
name = "podcasterator"
version = "0.1.0"
description = "Local podcast server for organizing and serving audio files"
authors = ["John Bergmayer"]
edition = "2021"

[lib]
name = "podcasterator_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-clipboard-manager = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
rss = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
mime = "0.3"
dirs = "6"
walkdir = "2"
local-ip-address = "0.6"
chrono = "0.4"
urlencoding = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = false
