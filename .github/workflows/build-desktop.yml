name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles app,dmg
            apple-signing-identity: "-"
          - name: Linux x86_64
            platform: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: --bundles appimage,deb
            apple-signing-identity: ""
          - name: Windows x86_64
            platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --bundles nsis,msi
            apple-signing-identity: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
          components: rustfmt,clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build native bundles
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple-signing-identity }}
        with:
          args: ${{ matrix.tauri-args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Podcasterator-[platform]-[arch]-[bundle]
